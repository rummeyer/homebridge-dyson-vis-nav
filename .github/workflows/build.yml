# Build and check on every supported Node.js version.
#
# Homebridge verification requires that a plugin run on all supported LTS
# versions of Node.js. This is what demonstrates that rather than asserting it:
# a version that stops working fails here instead of reaching a user.
#
# The matrix mirrors `engines.node` in package.json. Keep the two in step.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Compiles, generates the runtime type checkers, and runs the three checks
      # covering the parts of a Homebridge plugin no compiler can see
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Replaying the recorded Vis Nav session exercises the whole device layer
      # without hardware: cleaning, docking, charging, mode changes and faults
      - name: Replay a recorded session
        run: node bin/check-recorded-session.mjs
